<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baduk Cast TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600&family=Montserrat:wght@600;700&display=swap">
<style>
  :root { --bg:#15120e; --panel:#221d17; --ink:#f3e6c8; --muted:#b7a789; --accent:#e0b85a; --wood:#dcb35c; --pad:3vh; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:'Roboto Slab',Georgia,serif; overflow:hidden; }
  #stage { height:100vh; display:flex; padding:var(--pad); align-items:stretch; justify-content:center; }
  #boardWrap { height:calc(100vh - 2*var(--pad)); width:calc(100vh - 2*var(--pad)); flex:none; margin-right:var(--pad); background:var(--wood);
    border-radius:6px; box-shadow:0 1.5vh 5vh #000a, inset 0 0 0 1px #0002; padding:1.2vh; }
  #boardWrap svg { width:100%; height:100%; display:block; }
  #side { flex:0 1 34vw; min-width:0; display:flex; flex-direction:column; }
  #side > * + * { margin-top:2.4vh; }
  body.noface:not(.problem) #side { flex-basis:22vw; }
  h1 { font:700 3.4vh/1.15 Montserrat,system-ui,sans-serif; margin:0; text-wrap:balance; }
  .label { font:600 1.6vh Montserrat,system-ui,sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  #faceBox { position:relative; width:100%; height:0; padding-top:75%; border-radius:6px; overflow:hidden; background:#000; box-shadow:0 1vh 3vh #0008; }
  #faceBox iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:0; display:block; }
  /* face off: keep the player running for the sound, but out of sight */
  body.noface #faceBox, body.problem #faceBox { position:fixed; width:2px; height:2px; padding-top:0; left:0; bottom:0; opacity:0; pointer-events:none; }
  #progress { display:flex; align-items:center; font:600 1.9vh Montserrat,system-ui,sans-serif; color:var(--muted); font-variant-numeric:tabular-nums; }
  #progress .track { flex:1; margin:0 1.4vh; height:.8vh; border-radius:999px; background:#ffffff1f; overflow:hidden; }
  #progress .fill { height:100%; width:0; background:var(--accent); border-radius:inherit; transition:width .5s linear; }
  #progress .now { color:var(--ink); }
  body.problem #progress, body.nodur #progress { display:none; }
  #problem { display:none; background:var(--panel); border-radius:6px; padding:2.6vh; }
  body.problem #problem { display:block; }
  #problem .t { font:700 3.2vh Montserrat,system-ui,sans-serif; margin:.6vh 0 1.4vh; }
  #problem .d { font-size:2.4vh; line-height:1.45; color:var(--ink); white-space:pre-line; }
  #problem .hint { margin-top:2vh; font-size:1.9vh; color:var(--muted); }
  #status { margin-top:auto; font-size:1.7vh; color:var(--muted); }
  #toast { position:fixed; left:50%; top:45%; transform:translate(-50%,-50%); background:#000c; color:var(--ink); font:700 4vh Montserrat,system-ui,sans-serif;
    padding:2vh 4vh; border-radius:2vh; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.on { opacity:1; }
  #splash { position:fixed; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; text-align:center; background:var(--bg); }
  #splash .code { font:700 14vh/1 Montserrat,system-ui,sans-serif; letter-spacing:.08em; color:var(--accent); margin:3vh 0; }
  #splash .small { font-size:2vh; margin-top:3vh; }
  #splash h2 { font:700 5vh Montserrat,system-ui,sans-serif; margin:0 0 2vh; }
  #splash p { color:var(--muted); font-size:2.4vh; margin:0; }
  #sound { position:fixed; left:50%; top:4vh; transform:translateX(-50%); display:none; background:var(--accent); color:#1d1a16;
    font:600 2vh Montserrat,system-ui,sans-serif; padding:1.4vh 2.4vh; border-radius:999px; border:0; cursor:pointer; }
</style>
</head>
<body class="nodur">
<div id="stage">
  <div id="boardWrap"></div>
  <div id="side">
    <div class="label">Awesome Baduk</div>
    <h1 id="lesson"></h1>
    <div id="faceBox"></div>
    <div id="progress"><span class="now">0:00</span><div class="track"><div class="fill"></div></div><span class="dur">0:00</span></div>
    <div id="problem">
      <div class="label">Problem</div>
      <div class="t"></div>
      <div class="d"></div>
      <div class="hint">Solve it on your phone. The board here follows your moves.</div>
    </div>
    <div id="status">Waiting for the phone…</div>
  </div>
</div>
<div id="splash"><div><h2>Baduk Cast</h2><p id="splashText">Connected. Open a lesson on your phone.</p><div class="code" id="code"></div><p class="small" id="net"></p></div></div>
<script src="mqtt-lite.js"></script>
<button id="sound">Click to turn on sound</button>
<script>
(() => {
  const SITE_ORIGIN = 'https://awesomebaduk.com';
  const $ = s => document.querySelector(s);
  let lastToggle = 0, player = null, playerId = null, tv = { t: 0, paused: true }, want = null, lastSeek = 0;

  // ---------- board (sanitised copy of the site's SVG) ----------
  const images = {};   // stone images sent by the phone (url -> data: URI)
  let lastSvg = '';
  function showBoard(svgText) {
    lastSvg = svgText;
    if (!/^<svg[^>]*\sxmlns=/.test(svgText)) svgText = svgText.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
    if (/xlink:/.test(svgText) && !/xmlns:xlink=/.test(svgText)) svgText = svgText.replace(/^<svg/, '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
    const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
    const svg = doc.documentElement;
    if (!svg || svg.nodeName !== 'svg') return;
    svg.querySelectorAll('script,foreignObject,iframe,a').forEach(n => n.remove());
    svg.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => {
      if (/^on/i.test(a.name)) n.removeAttribute(a.name);
      if (/href$/i.test(a.name) && !(a.value.startsWith(SITE_ORIGIN + '/') || a.value.startsWith('#'))) n.removeAttribute(a.name);
    }));
    svg.querySelectorAll('image').forEach(n => {   // use the phone's copy; set both forms for older TV browsers
      const h = n.getAttribute('href') || n.getAttributeNS('http://www.w3.org/1999/xlink', 'href') || '';
      const v = images[h] || h;
      if (!v) return;
      n.setAttribute('href', v);
      n.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', v);
    });
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    const wrap = $('#boardWrap'); wrap.innerHTML = ''; wrap.appendChild(document.importNode(svg, true));
    $('#splash').style.display = 'none';
  }

  // ---------- teacher video (Vimeo, follows the phone) ----------
  const vimeo = (method, value) => player && player.contentWindow &&
    player.contentWindow.postMessage(JSON.stringify(value === undefined ? { method } : { method, value }), 'https://player.vimeo.com');
  function loadVideo(id) {
    playerId = id;
    $('#faceBox').innerHTML = '';
    if (!id) { player = null; return; }
    player = document.createElement('iframe');
    player.allow = 'autoplay; fullscreen';
    player.src = `https://player.vimeo.com/video/${encodeURIComponent(id)}?autoplay=1&controls=0&title=0&byline=0&portrait=0&dnt=1`;
    $('#faceBox').appendChild(player);
  }
  window.addEventListener('message', e => {
    if (e.origin === 'https://player.vimeo.com') {
      let d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (err) { return; }
      if (d.method === 'getCurrentTime') tv.t = +d.value || 0;
      if (d.method === 'getPaused') tv.paused = !!d.value;
      if (d.event === 'ready') { vimeo('setVolume', 1); sync(); }
      return;
    }
    if (e.origin === SITE_ORIGIN && location.hash === '#test') handle(e.data);   // desktop test mode
  });
  setInterval(() => { if (player) { vimeo('getCurrentTime'); vimeo('getPaused'); } }, 500);

  const fmt = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };
  function progress() {
    const d = want && want.duration;
    document.body.classList.toggle('nodur', !d);
    if (!d) return;
    const t = Math.min(d, player ? tv.t : want.t);
    $('#progress .now').textContent = fmt(t);
    $('#progress .dur').textContent = fmt(d);
    $('#progress .fill').style.width = (100 * t / d).toFixed(2) + '%';
  }
  setInterval(progress, 500);
  function sync() {
    if (!want || !player) return;
    const shouldPause = want.paused || document.body.classList.contains('problem');
    if (shouldPause && !tv.paused) vimeo('pause');
    if (!shouldPause && tv.paused) vimeo('play');
    const target = want.t + (want.paused ? 0 : (Date.now() - want.at) / 1000);
    if (Math.abs(tv.t - target) > 1.5 && Date.now() - lastSeek > 3000) { lastSeek = Date.now(); vimeo('setCurrentTime', target); }
    // autoplay with sound refused (desktop test window): ask for one click
    $('#sound').style.display = (!shouldPause && tv.paused && Date.now() - lastSeek > 4000) ? 'block' : 'none';
  }
  $('#sound').onclick = () => { vimeo('play'); $('#sound').style.display = 'none'; };
  setInterval(sync, 1000);

  // ---------- messages from the phone ----------
  function handle(raw) {
    let m; try { m = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { return; }
    if (m.type === 'ping') toPhone({ type: 'hello' });   // phone (re)connected: it resends everything
    if (m.type === 'board' && typeof m.svg === 'string') showBoard(m.svg);
    if (m.type === 'img' && typeof m.url === 'string' && /^data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+\/=]+$/.test(m.data || '')) {
      images[m.url] = m.data;
      if (lastSvg) showBoard(lastSvg);
    }
    if (m.type === 'state') {
      $('#lesson').textContent = m.lesson || '';
      document.body.classList.toggle('noface', !m.face);
      document.body.classList.toggle('problem', m.mode === 'problem');
      if (m.problem) { $('#problem .t').textContent = m.problem.title; $('#problem .d').textContent = m.problem.text; }
      const v = m.video || {};
      if (v.id && v.id !== playerId) loadVideo(v.id);
      if (v.id) want = { t: (Date.now() - lastSeek < 1500 && want) ? want.t + (want.paused ? 0 : (Date.now() - want.at) / 1000) : (+v.t || 0), paused: (Date.now() - lastToggle < 3500 && want) ? want.paused : !!v.paused, duration: +v.duration || 0, at: Date.now() };   // a remote press wins until the phone has caught up
      $('#status').textContent = m.mode === 'problem' ? 'Problem in progress' : (v.paused ? 'Paused on the phone' : 'Playing');
      sync();
    }
  }
  // ---------- TV remote: play/pause goes back to the phone (the phone player is the master) ----------
  const phones = [];
  const toPhone = obj => {
    const msg = JSON.stringify(obj);
    phones.forEach(c => { try { if (c.state === 'connected') c.send(msg); } catch (e) {} });
    if (location.hash === '#test' && window.opener) window.opener.postMessage(msg, SITE_ORIGIN);
  };
  function remote(action, by) {
    if (action === 'seek') {               // left/right: jump in the clip; repeated presses add up
      if (!want) return;
      const now = want.t + (want.paused ? 0 : (Date.now() - want.at) / 1000);
      const t = Math.max(0, Math.min(want.duration || Infinity, now + by));
      want.t = t; want.at = Date.now(); lastSeek = Date.now(); lastToggle = Date.now();
      toPhone({ type: 'control', action: 'seek', t });
      vimeo('setCurrentTime', t); tv.t = t;
      showToast((by < 0 ? '⏪ ' : '⏩ ') + fmt(t)); progress();
      return;
    }
    if (Date.now() - lastToggle < 400) return;   // one press can arrive as key + media event
    lastToggle = Date.now();
    if (action === 'toggle') action = want && !want.paused ? 'pause' : 'play';
    toPhone({ type: 'control', action });
    if (want) { want.paused = action === 'pause'; want.t = player ? tv.t : want.t; want.at = Date.now(); }
    showToast(action === 'pause' ? '❚❚  Paused' : '▶  Playing');
    sync();
  }
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (['Enter', ' ', 'MediaPlayPause', 'k', 'Select'].includes(k) || e.keyCode === 179) { e.preventDefault(); remote('toggle'); }
    else if (k === 'ArrowLeft' || k === 'MediaRewind' || k === 'MediaTrackPrevious' || e.keyCode === 412) { e.preventDefault(); remote('seek', -10); }
    else if (k === 'ArrowRight' || k === 'MediaFastForward' || k === 'MediaTrackNext' || e.keyCode === 417) { e.preventDefault(); remote('seek', 10); }
    else if (k === 'MediaPlay' || e.keyCode === 415) { e.preventDefault(); remote('play'); }
    else if (k === 'MediaPause' || k === 'MediaStop' || e.keyCode === 19 || e.keyCode === 413) { e.preventDefault(); remote('pause'); }
  });
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', () => remote('play'));
      navigator.mediaSession.setActionHandler('pause', () => remote('pause'));
      navigator.mediaSession.setActionHandler('seekbackward', () => remote('seek', -10));
      navigator.mediaSession.setActionHandler('seekforward', () => remote('seek', 10));
    } catch (e) {}
  }
  const toast = document.createElement('div');
  toast.id = 'toast';
  document.body.appendChild(toast);
  let toastTimer = 0;
  function showToast(t) { toast.textContent = t; toast.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('on'), 1500); }

  if (location.hash === '#test' && window.opener) window.opener.postMessage(JSON.stringify({ type: 'hello' }), SITE_ORIGIN);
  // ---------- connection to the phone ----------
  const isCast = /CrKey/.test(navigator.userAgent);
  if (isCast) {                                       // Chromecast / Google Cast TV: registered custom receiver
    const NS = 'urn:x-cast:io.github.ai-projects-lab.badukcast';
    const sc = document.createElement('script');
    sc.src = 'https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js';
    sc.onload = () => {
      const ctx = cast.framework.CastReceiverContext.getInstance();
      ctx.addCustomMessageListener(NS, e => handle(e.data));
      ctx.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, e => {
        try { ctx.sendCustomMessage(NS, e.senderId, { type: 'hello' }); } catch (err) {}
      });
      phones.push({ state: 'connected', send: msg => { try { ctx.sendCustomMessage(NS, undefined, JSON.parse(msg)); } catch (err) {} } });
      const opts = new cast.framework.CastReceiverOptions();
      opts.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
      opts.disableIdleTimeout = true;   // no media element: keep the app open during problems and pauses
      opts.skipPlayersLoad = true;
      ctx.start(opts);
    };
    document.head.appendChild(sc);
  } else if (location.hash !== '#test') {             // any TV browser (e.g. Samsung): pairing code over MQTT
    let code = '';
    try { code = localStorage.getItem('badukCastCode') || ''; } catch (e) {}
    if (!/^\d{6}$/.test(code)) {
      code = String(Math.floor(100000 + Math.random() * 900000));
      try { localStorage.setItem('badukCastCode', code); } catch (e) {}
    }
    $('#splashText').textContent = 'On your phone, tap 📺 and enter this code:';
    $('#code').textContent = code.slice(0, 3) + ' ' + code.slice(3);
    let lastFromPhone = 0;
    const client = BadukMqtt.connect({
      onMessage: (topic, text) => { lastFromPhone = Date.now(); handle(text); },
      onState: st => {
        $('#net').textContent = st === 'online' ? 'Ready. Waiting for the phone…' : (st === 'connecting' ? 'Connecting…' : 'Offline, retrying…');
        if (st === 'online') client.publish(BadukMqtt.topic(code, 'phone'), JSON.stringify({ type: 'hello' }));
      }
    });
    client.subscribe(BadukMqtt.topic(code, 'tv'));
    phones.push({ state: 'connected', send: msg => client.publish(BadukMqtt.topic(code, 'phone'), msg) });
    setInterval(() => {                                  // phone gone for a while: show the code again
      if (lastFromPhone && Date.now() - lastFromPhone > 20000) { $('#splash').style.display = ''; $('#splashText').textContent = 'Phone disconnected. Tap 📺 on the phone with code:'; }
    }, 5000);
  }
})();
</script>
</body>
</html>
